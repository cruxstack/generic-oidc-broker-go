{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>OIDC Broker Debug</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f8; --surface: #ffffff; --text: #18181b; --muted: #6b7280;
      --border: #e4e4e7; --accent: #2563eb; --error: #b91c1c; --warn: #a16207;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0b0d; --surface: #18181b; --text: #f4f4f5; --muted: #a1a1aa;
        --border: #27272a; --accent: #60a5fa; --error: #f87171; --warn: #facc15;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 32px 16px; background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 15px; margin: 0 0 12px; }
    p.lead { color: var(--muted); margin: 0 0 24px; }
    section {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 16px; margin-bottom: 16px;
    }
    ul.links { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    ul.links a {
      display: block; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 6px; color: var(--accent); text-decoration: none; overflow-wrap: anywhere;
    }
    ul.links a:hover { border-color: var(--accent); }
    pre, textarea {
      width: 100%; margin: 0; padding: 12px; border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg); color: var(--text); font: 12px/1.5 ui-monospace, Menlo, monospace;
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
    textarea { height: 7em; resize: vertical; }
    .error { color: var(--error); }
    .warn { color: var(--warn); }
    .muted { color: var(--muted); }
    label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  </style>
</head>
<body>
  <main>
    <h1>OIDC Broker Debug</h1>
    <p class="lead">Development only. Do not enable these pages in production.</p>
    {{template "content" .}}
  </main>
</body>
</html>
{{end}}
