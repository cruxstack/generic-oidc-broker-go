{{define "content"}}
<section>
  <h2>Sign in</h2>
  {{if .SignIns}}
  <ul class="links">
    {{range .SignIns}}<li><a href="{{.URL}}">Sign in with {{.Label}}</a></li>
    {{end}}
  </ul>
  {{else}}
  <p class="muted">No providers are configured.</p>
  {{end}}
</section>

<section>
  <h2>Discovery documents</h2>
  <ul class="links">
    {{range .Discovery}}<li><a href="{{.URL}}">{{.Label}}: {{.URL}}</a></li>
    {{end}}
  </ul>
</section>
{{end}}
