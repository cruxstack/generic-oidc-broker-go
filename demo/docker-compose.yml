# Offline demo: the broker with all three provider types backed by the mock
# provider. Start it with `make demo`, then open http://localhost:3000/debug/login.
services:
  # Generates the token signing key on first start.
  keys:
    image: alpine:3.24
    command:
      - sh
      - -c
      - |
        if [ ! -f /keys/private.pem ]; then
          apk add --no-cache openssl >/dev/null
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /keys/private.pem
          chmod 644 /keys/private.pem
        fi
    volumes:
      - keys:/keys

  mock-provider:
    build:
      context: ..
      target: mock-provider
    ports:
      - "9999:9999"

  broker:
    build:
      context: ..
      target: broker
    ports:
      - "3000:3000"
    environment:
      APP_LOG_LEVEL: debug
      APP_OIDC_ISSUER: http://localhost:3000
      APP_SESSION_SECRET: demo-session-secret-not-for-production
      APP_KEY_ID: demo-key
      APP_KEY_PRIVATE_PEM_PATH: /keys/private.pem
      APP_OIDC_CLIENTS: >-
        [{"client_id": "demo-client", "client_secret": "demo-secret",
          "redirect_uris": ["http://localhost:3000/debug/callback"]}]
      # Browsers reach the mock at localhost:9999; the broker reaches it at
      # mock-provider:9999 on the compose network.
      APP_PROVIDERS: >-
        [{"name": "twitter", "client_id": "mock-twitter", "client_secret": "mock-secret",
          "callback_url": "http://localhost:3000/auth/twitter/callback",
          "auth_url": "http://localhost:9999/twitter/authorize",
          "token_url": "http://mock-provider:9999/twitter/token",
          "user_url": "http://mock-provider:9999/twitter/user"},
         {"name": "github", "client_id": "mock-github", "client_secret": "mock-secret",
          "callback_url": "http://localhost:3000/auth/github/callback",
          "auth_url": "http://localhost:9999/github/authorize",
          "token_url": "http://mock-provider:9999/github/token",
          "user_url": "http://mock-provider:9999/github/user"},
         {"name": "google", "client_id": "mock-google", "client_secret": "mock-secret",
          "callback_url": "http://localhost:3000/auth/google/callback",
          "auth_url": "http://localhost:9999/google/authorize",
          "token_url": "http://mock-provider:9999/google/token",
          "user_url": "http://mock-provider:9999/google/userinfo"}]
      APP_DEBUG_ENABLED: "true"
      APP_DEBUG_CLIENT_ID: demo-client
      APP_DEBUG_CLIENT_SECRET: demo-secret
    volumes:
      - keys:/keys:ro
    depends_on:
      keys:
        condition: service_completed_successfully
      mock-provider:
        condition: service_healthy

volumes:
  keys:
